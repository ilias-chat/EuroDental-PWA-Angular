<ion-modal
  class="create-task-modal"
  [isOpen]="isOpen()"
  (didDismiss)="close()"
>
  <ng-template>
    <div class="services-picker-shell">
      <div class="services-picker-handle" aria-hidden="true"></div>
      <header class="services-picker-header">
        <h2 class="services-picker-title">Nouvelle tâche</h2>
        <button type="button" class="services-picker-close" (click)="close()" aria-label="Fermer">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </header>

      <div class="services-picker-scroll">
        <app-task-form-fields />
      </div>

      <footer class="services-picker-footer">
        <button
          type="button"
          class="payment-modal-save"
          [disabled]="f.creating()"
          (click)="submit()"
        >
          @if (f.creating()) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            Créer la tâche
          }
        </button>
      </footer>
    </div>
  </ng-template>
</ion-modal>
